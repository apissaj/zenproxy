name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows, freebsd]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: arm64
            # darwin arm64 needs CGO-less build; covered by cross compile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w" -o "zenproxy_${GOOS}_${GOARCH}${EXT}" .

      - name: Package
        run: |
          for f in zenproxy_*; do
            tar -czf "$f.tar.gz" "$f"
          done
          sha256sum zenproxy_*.tar.gz > checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: zenproxy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: zenproxy_*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/zenproxy_*.tar.gz
            artifacts/checksums.txt
